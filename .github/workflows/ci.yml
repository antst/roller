name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dsh: [0.2.2-rc.3]
        os: [ubuntu-latest, macos-15]
        node: ['24.9.0']
        include:
          - dsh: 0.2.2-rc.3
            os: ubuntu-latest
            node: '26'
    env:
      DSH_TEST_VERSION: ${{ matrix.dsh }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: node --version
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '24.9.0'
        run: bash scripts/gate-docker.sh
      - if: matrix.os != 'ubuntu-latest' || matrix.node != '24.9.0'
        run: node scripts/run-version-gate.mjs
      - name: Native below-floor add refusal
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.9.0'
        run: |
          pnpm --dir packages/roller pack --pack-destination "$RUNNER_TEMP"
          node scripts/prove-below-floor.mjs "$RUNNER_TEMP/antst-roller-0.2.0.tgz" "$RUNNER_TEMP/roller-floor-evidence"
      - name: Publish preview
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop') && matrix.os == 'ubuntu-latest' && matrix.node == '24.9.0'
        run: pnpx pkg-pr-new publish ./packages/roller --compact --pnpm
